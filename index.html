<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ヤミイチ | Pinda Lab</title>
<meta name="description" content="戦後闇市の屋台主になれ！客の注文をさばく3Dショップシム。60秒で何円稼げる？">
<meta property="og:title" content="ヤミイチ — Yamiichi">
<meta property="og:description" content="Tap the right item, then tap the customer. 60-second black-market stall sim.">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#4a3228;color:#fef3c7;font-family:'Hiragino Maru Gothic ProN',system-ui,sans-serif;user-select:none}
#scene{position:fixed;inset:0}
.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:5;gap:8px}
.badge{background:rgba(0,0,0,0.55);border:1px solid #f59e0b;border-radius:10px;padding:6px 12px;backdrop-filter:blur(6px)}
.badge .lbl{font-size:10px;color:#f59e0b;letter-spacing:1px;text-transform:uppercase;font-family:system-ui,sans-serif}
.badge .val{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:#fef3c7}
.combo{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:900;color:#facc15;text-shadow:0 2px 12px rgba(0,0,0,0.6);opacity:0;transition:opacity .2s,transform .3s;pointer-events:none;z-index:8}
.combo.show{opacity:1;transform:translate(-50%,-60%)}
.timer-bar{position:fixed;top:56px;left:50%;transform:translateX(-50%);width:min(240px,70vw);height:6px;background:rgba(245,158,11,0.2);border:1px solid #f59e0b;border-radius:3px;overflow:hidden;z-index:5}
.timer-bar-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);width:100%;transition:width .25s}
.timer-label{position:fixed;top:43px;left:50%;transform:translateX(-50%);font-size:9px;color:#fbbf24;letter-spacing:2px;text-transform:uppercase;font-family:system-ui,sans-serif;z-index:5}

/* Item bar */
.item-bar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;padding:10px 6px 14px;background:linear-gradient(0deg,rgba(30,20,14,0.95) 60%,transparent);z-index:6;pointer-events:auto}
.item-btn{width:62px;height:72px;border:2px solid #92400e;border-radius:12px;background:rgba(120,80,40,0.5);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s,border-color .1s,background .1s;touch-action:manipulation;gap:2px}
.item-btn .emoji{font-size:28px;line-height:1}
.item-btn .price{font-size:10px;color:#fbbf24;font-weight:700;font-family:system-ui,sans-serif}
.item-btn.selected{border-color:#facc15;background:rgba(250,204,21,0.25);transform:scale(1.12);box-shadow:0 0 16px rgba(250,204,21,0.4)}
.item-btn:active{transform:scale(0.95)}

.banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(30,20,14,0.95);border:2px solid #f59e0b;border-radius:16px;padding:22px 28px;text-align:center;z-index:20;min-width:260px;max-width:88vw}
.banner .big{font-size:34px;font-weight:900;color:#f59e0b}
.banner .label{font-size:12px;color:#fbbf24;letter-spacing:2px;text-transform:uppercase;font-family:system-ui,sans-serif;margin-bottom:6px}
.banner .small{font-size:13px;color:#d6d3d1;margin-top:8px;line-height:1.6}
.banner .stats{display:flex;justify-content:space-around;margin:12px 0;gap:14px}
.banner .stats div{font-size:10px;color:#fbbf24;letter-spacing:1px}
.banner .stats div b{display:block;font-size:20px;color:#fef3c7;font-weight:900;margin-top:2px}
.banner button{margin-top:12px;background:#f59e0b;color:#1c1917;border:none;padding:10px 28px;border-radius:8px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.hidden{display:none !important}
.lang-switch{position:fixed;top:10px;right:10px;display:flex;gap:2px;background:rgba(30,20,14,0.85);border:1px solid #92400e;border-radius:8px;padding:3px;z-index:10}
.lang-btn{background:transparent;border:none;color:#a8a29e;font-size:11px;font-weight:600;padding:4px 8px;border-radius:5px;cursor:pointer;font-family:system-ui,sans-serif}
.lang-btn.active{background:#f59e0b;color:#1c1917}
.foot{position:fixed;bottom:4px;right:8px;font-size:9px;color:#78716c;font-family:system-ui,sans-serif;z-index:7}
.foot a{color:#d97706;text-decoration:none}
.flash{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity .12s}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
    <div class="badge"><div class="lbl" data-i18n="yen">売上</div><div class="val" id="score">0¥</div></div>
    <div class="badge"><div class="lbl" data-i18n="served">捌いた</div><div class="val" id="served">0</div></div>
</div>
<div class="timer-label" data-i18n="timeLabel">残り時間</div>
<div class="timer-bar"><div class="timer-bar-fill" id="time"></div></div>
<div class="combo" id="comboMsg"></div>
<div class="flash" id="flash"></div>

<!-- Item selection bar -->
<div class="item-bar hidden" id="itemBar">
    <button class="item-btn" data-item="rice"><span class="emoji">🍚</span><span class="price">30¥</span></button>
    <button class="item-btn" data-item="sweet"><span class="emoji">🍠</span><span class="price">20¥</span></button>
    <button class="item-btn" data-item="cig"><span class="emoji">🚬</span><span class="price">40¥</span></button>
    <button class="item-btn" data-item="soap"><span class="emoji">🧼</span><span class="price">25¥</span></button>
    <button class="item-btn" data-item="candy"><span class="emoji">🍬</span><span class="price">35¥</span></button>
</div>

<!-- Start screen -->
<div class="banner" id="startBanner">
    <div class="label" data-i18n="startLabel">ヤミイチ</div>
    <div class="big" data-i18n="startTitle">🏪 60秒チャレンジ</div>
    <div class="small" data-i18n="startDesc">客の吹き出しを見て、同じ商品をタップ。<br>次に客をタップして渡そう。速いとボーナス！</div>
    <button id="startBtn" data-i18n="startPlay">はじめる</button>
</div>

<!-- End screen -->
<div class="banner hidden" id="banner">
    <div class="label" data-i18n="result">営業終了</div>
    <div class="big" id="bannerBig">0¥</div>
    <div class="stats">
        <div><span data-i18n="yenS">売上</span><b id="sYen">0¥</b></div>
        <div><span data-i18n="servedS">捌いた</span><b id="sServ">0</b></div>
        <div><span data-i18n="bestS">ベスト</span><b id="sBest">0¥</b></div>
    </div>
    <div class="small" data-i18n="bannerSub">戦後闇市の屋台 — どれだけ稼げた？</div>
    <button id="restart" data-i18n="replay">もう一度</button>
</div>

<div class="lang-switch">
    <button class="lang-btn active" data-lang="ja">JP</button>
    <button class="lang-btn" data-lang="en">EN</button>
</div>
<div class="foot"><a href="https://pndshch.github.io/" target="_blank">← Pinda Lab</a></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.161.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

let lang = 'ja';

const I18N = {
    ja:{yen:'売上',served:'捌いた',timeLabel:'残り時間',
        result:'営業終了',yenS:'売上',servedS:'捌いた',bestS:'ベスト',
        bannerSub:'戦後闇市の屋台 — どれだけ稼げた？',replay:'もう一度',
        startLabel:'ヤミイチ',startTitle:'🏪 60秒チャレンジ',
        startDesc:'客の吹き出しを見て、同じ商品をタップ。<br>次に客をタップして渡そう。速いとボーナス！',
        startPlay:'はじめる',
        correct:'ありがと！',wrong:'ちがう！',leave:'帰った…',quick:'速い！',selectFirst:'まず商品を選んで'},
    en:{yen:'YEN',served:'SERVED',timeLabel:'TIME',
        result:'CLOSED',yenS:'YEN',servedS:'SERVED',bestS:'BEST',
        bannerSub:'Postwar black-market stall — how much did you earn?',replay:'Replay',
        startLabel:'YAMIICHI',startTitle:'🏪 60-Second Challenge',
        startDesc:'See the customer\'s thought bubble, tap the matching item below.<br>Then tap the customer to deliver. Speed = bonus!',
        startPlay:'Start',
        correct:'Thanks!',wrong:'Wrong!',leave:'Left…',quick:'Quick!',selectFirst:'Pick an item first'}
};

// ── Audio ──
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(freq, dur, type, vol){
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    g.connect(audioCtx.destination);
    const o = audioCtx.createOscillator();
    o.type = type; o.frequency.value = freq;
    o.connect(g); o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxCoin(){ playTone(880, 0.1, 'sine', 0.3); setTimeout(()=>playTone(1320, 0.15, 'sine', 0.25), 80); }
function sfxBonus(){ playTone(660, 0.08, 'sine', 0.25); setTimeout(()=>playTone(990, 0.08, 'sine', 0.25), 60); setTimeout(()=>playTone(1320, 0.15, 'sine', 0.3), 120); }
function sfxWrong(){ playTone(220, 0.2, 'sawtooth', 0.15); }
function sfxLeave(){ playTone(300, 0.15, 'triangle', 0.12); playTone(200, 0.25, 'triangle', 0.12); }
function sfxSelect(){ playTone(600, 0.06, 'sine', 0.15); }

const flashEl = document.getElementById('flash');
function screenFlash(color){
    flashEl.style.background = color;
    flashEl.style.opacity = '0.3';
    setTimeout(()=>{ flashEl.style.opacity = '0'; }, 100);
}

// ── Three.js setup ──
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8b6e5a');
scene.fog = new THREE.Fog('#8b6e5a', 18, 40);

const isMobile = window.innerWidth < 600;
const camera = new THREE.PerspectiveCamera(isMobile ? 55 : 50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, isMobile ? 4.5 : 4.0, isMobile ? 6.0 : 7.0);
camera.lookAt(0, 0.8, 0);

// Bright warm lighting
scene.add(new THREE.AmbientLight(0xfff5e0, 0.6));
const hemi = new THREE.HemisphereLight(0xffeedd, 0x886644, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe8c0, 1.8);
sun.position.set(5, 12, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -10; sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10; sun.shadow.camera.bottom = -10;
scene.add(sun);
const lampLight = new THREE.PointLight(0xffcc66, 2.5, 15);
lampLight.position.set(0, 3.0, 0.5); scene.add(lampLight);

// Ground — warm sandy dirt
const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({color:'#a08060', roughness:0.9})
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// Stall counter (bright wood)
const woodMat = new THREE.MeshStandardMaterial({color:'#c4956a', roughness:0.7});
const counter = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.8, 1.0), woodMat);
counter.position.set(0, 0.4, -0.2); counter.castShadow = true; counter.receiveShadow = true;
scene.add(counter);

// Stall roof
const roofMat = new THREE.MeshStandardMaterial({color:'#8b5e3c', roughness:0.8});
const roof = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.08, 1.8), roofMat);
roof.position.set(0, 2.2, -0.3); roof.rotation.x = -0.15;
roof.castShadow = true; scene.add(roof);
// Poles
for(const x of [-2.2, 2.2]){
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 8), woodMat);
    pole.position.set(x, 1.1, -0.8); pole.castShadow = true; scene.add(pole);
}

// Backdrop — simple wall
const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 6),
    new THREE.MeshStandardMaterial({color:'#7a6050', roughness:0.95})
);
wall.position.set(0, 3, -4); scene.add(wall);

// Items on counter (visible colored objects with labels)
const ITEMS = [
    {key:'rice',  emoji:'🍚', price:30, x:-1.4, color:0xf5f5dc},
    {key:'sweet', emoji:'🍠', price:20, x:-0.7, color:0xd2691e},
    {key:'cig',   emoji:'🚬', price:40, x: 0.0, color:0x8b8b7a},
    {key:'soap',  emoji:'🧼', price:25, x: 0.7, color:0x87ceeb},
    {key:'candy', emoji:'🍬', price:35, x: 1.4, color:0xff6b6b},
];

// Place colored cubes on counter as visual items
for(const it of ITEMS){
    const mat = new THREE.MeshStandardMaterial({color: it.color, roughness:0.4});
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.35), mat);
    mesh.position.set(it.x, 1.05, -0.2);
    mesh.castShadow = true;
    scene.add(mesh);
    it.mesh = mesh;
}

// ── Customers ──
const CUST_COLORS = [0xd97706, 0x059669, 0x7c3aed, 0xdc2626];
const CUST_SLOTS = [-1.8, -0.6, 0.6, 1.8];
const slotOcc = [false, false, false, false];
let customers = [];

function makeCustomerMesh(){
    const color = CUST_COLORS[Math.floor(Math.random() * CUST_COLORS.length)];
    const g = new THREE.Group();
    // Body
    const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.3, 0.8, 8),
        new THREE.MeshStandardMaterial({color, roughness:0.5})
    );
    body.position.y = 0.4; body.castShadow = true; g.add(body);
    // Head
    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 12, 8),
        new THREE.MeshStandardMaterial({color:0xfcd5b4, roughness:0.5})
    );
    head.position.y = 1.0; head.castShadow = true; g.add(head);
    return g;
}

function makeBubbleSprite(emoji){
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(64, 52, 48, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(50, 92); ctx.lineTo(64, 112); ctx.lineTo(78, 92); ctx.fill();
    ctx.strokeStyle = '#92400e'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(64, 52, 48, 0, Math.PI * 2); ctx.stroke();
    ctx.font = '56px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(emoji, 64, 52);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false, depthWrite:false}));
    sp.scale.set(1.1, 1.1, 1);
    return sp;
}

function spawnCustomer(){
    const free = slotOcc.map((o,i) => o ? -1 : i).filter(i => i >= 0);
    if(free.length === 0) return;
    const slot = free[Math.floor(Math.random() * free.length)];
    slotOcc[slot] = true;
    const root = makeCustomerMesh();
    root.position.set(CUST_SLOTS[slot], 0, 2.0);
    const want = ITEMS[Math.floor(Math.random() * ITEMS.length)];
    const bubble = makeBubbleSprite(want.emoji);
    bubble.position.set(0, 1.7, 0);
    root.add(bubble);
    scene.add(root);
    customers.push({ root, want: want.key, bubble, slot, life:0, leaveAt: 6.5 + Math.random()*2, isLeaving:false });
}

// ── Game state ──
const STATE = { yen:0, served:0, time:60, running:false, t:0 };
let selectedItem = null;
let spawnT = 0;

function showCombo(t){
    const c = document.getElementById('comboMsg');
    c.textContent = t; c.classList.add('show');
    clearTimeout(c._h); c._h = setTimeout(() => c.classList.remove('show'), 700);
}

function startGame(){
    if(audioCtx.state === 'suspended') audioCtx.resume();
    STATE.yen = 0; STATE.served = 0; STATE.time = 60; STATE.running = true; STATE.t = 0;
    selectedItem = null;
    document.getElementById('score').textContent = '0¥';
    document.getElementById('served').textContent = '0';
    document.getElementById('time').style.width = '100%';
    document.getElementById('banner').classList.add('hidden');
    document.getElementById('startBanner').classList.add('hidden');
    document.getElementById('itemBar').classList.remove('hidden');
    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
    customers.forEach(c => scene.remove(c.root)); customers = [];
    slotOcc.fill(false);
    spawnT = 0;
}

function endGame(){
    STATE.running = false;
    let best = STATE.yen;
    try { best = Math.max(STATE.yen, +(localStorage.getItem('ya-best')||0)); localStorage.setItem('ya-best', best); } catch(e){}
    document.getElementById('bannerBig').textContent = STATE.yen + '¥';
    document.getElementById('sYen').textContent = STATE.yen + '¥';
    document.getElementById('sServ').textContent = STATE.served;
    document.getElementById('sBest').textContent = best + '¥';
    document.getElementById('banner').classList.remove('hidden');
    document.getElementById('itemBar').classList.add('hidden');
}

document.getElementById('restart').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('click', startGame);

// ── Item selection (tap item button) ──
document.querySelectorAll('.item-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        if(!STATE.running) return;
        sfxSelect();
        selectedItem = btn.dataset.item;
        document.querySelectorAll('.item-btn').forEach(b => b.classList.toggle('selected', b === btn));
    });
});

// ── Customer tap (deliver item) ──
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function onTapScene(ev){
    if(!STATE.running) return;
    if(audioCtx.state === 'suspended') audioCtx.resume();

    const r = canvas.getBoundingClientRect();
    const src = ev.changedTouches ? ev.changedTouches[0] : ev;
    pointer.x = ((src.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((src.clientY - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);

    let bestCust = null, bestDist = Infinity;
    for(const c of customers){
        if(c.isLeaving) continue;
        const hits = raycaster.intersectObjects(c.root.children, true);
        if(hits.length && hits[0].distance < bestDist){
            bestCust = c; bestDist = hits[0].distance;
        }
    }

    if(!bestCust){
        // check if tapped near a customer by proximity
        for(const c of customers){
            if(c.isLeaving) continue;
            const screenPos = c.root.position.clone().project(camera);
            const dx = screenPos.x - pointer.x;
            const dy = screenPos.y - pointer.y;
            const d = Math.hypot(dx, dy);
            if(d < 0.25 && d < bestDist){ bestCust = c; bestDist = d; }
        }
    }

    if(!bestCust) return;

    if(!selectedItem){
        showCombo(I18N[lang].selectFirst);
        return;
    }

    if(selectedItem === bestCust.want){
        const it = ITEMS.find(i => i.key === selectedItem);
        const bonus = bestCust.life < 3 ? 1.5 : 1;
        const earn = Math.floor(it.price * bonus);
        STATE.yen += earn; STATE.served += 1;
        document.getElementById('score').textContent = STATE.yen + '¥';
        document.getElementById('served').textContent = STATE.served;
        const msg = '+' + earn + (bonus > 1 ? ' ' + I18N[lang].quick : '') + '¥';
        showCombo(msg);
        screenFlash('#facc15');
        if(bonus > 1) sfxBonus(); else sfxCoin();
        bestCust.isLeaving = true;
        bestCust.leaveDir = (Math.random() < 0.5 ? -1 : 1) * 3;
    } else {
        showCombo(I18N[lang].wrong);
        screenFlash('#ef4444');
        sfxWrong();
        bestCust.life += 1.5;
        // shake customer
        bestCust._shakeT = 0.3;
    }

    selectedItem = null;
    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('selected'));
}

canvas.addEventListener('click', onTapScene);
canvas.addEventListener('touchend', (ev) => {
    ev.preventDefault();
    onTapScene(ev);
}, {passive:false});

// ── Animation loop ──
const clock = new THREE.Clock();

function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    STATE.t += dt;

    lampLight.intensity = 2.3 + Math.sin(STATE.t * 4) * 0.4;

    // Rotate items on counter
    for(const it of ITEMS){
        if(it.mesh) it.mesh.rotation.y += dt * 0.8;
    }

    if(STATE.running){
        STATE.time -= dt;
        document.getElementById('time').style.width = Math.max(0, STATE.time / 60 * 100) + '%';
        if(STATE.time <= 0) endGame();

        spawnT -= dt;
        const interval = Math.max(1.0, 2.5 - STATE.served * 0.06);
        if(spawnT <= 0){ spawnT = interval; spawnCustomer(); }

        for(let i = customers.length - 1; i >= 0; i--){
            const c = customers[i];
            c.life += dt;

            if(c.isLeaving){
                c.root.position.x += c.leaveDir * dt;
                c.root.rotation.y = c.leaveDir > 0 ? Math.PI / 3 : -Math.PI / 3;
                if(Math.abs(c.root.position.x) > 6){
                    scene.remove(c.root); slotOcc[c.slot] = false; customers.splice(i, 1);
                }
                continue;
            }

            // Bob
            c.root.position.y = Math.sin(STATE.t * 2.5 + i * 1.5) * 0.03;

            // Shake on wrong delivery
            if(c._shakeT && c._shakeT > 0){
                c._shakeT -= dt;
                c.root.position.x = CUST_SLOTS[c.slot] + Math.sin(STATE.t * 40) * 0.06;
            } else {
                c.root.position.x = CUST_SLOTS[c.slot];
            }

            // Patience warning — bubble shakes
            const remaining = c.leaveAt - c.life;
            if(remaining < 2.0){
                c.bubble.position.x = Math.sin(STATE.t * 18) * 0.06;
                c.bubble.material.color.setHex(remaining < 1.0 ? 0xff6666 : 0xffcc66);
            }

            if(c.life > c.leaveAt){
                showCombo(I18N[lang].leave);
                sfxLeave();
                c.isLeaving = true;
                c.leaveDir = (Math.random() < 0.5 ? -1 : 1) * 3;
                STATE.yen = Math.max(0, STATE.yen - 5);
                document.getElementById('score').textContent = STATE.yen + '¥';
            }
        }
    }

    camera.position.x = Math.sin(STATE.t * 0.12) * 0.15;
    camera.lookAt(0, 0.8, 0);

    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
});

function applyLang(){
    document.documentElement.lang = lang;
    const dict = I18N[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if(dict[k] == null) return;
        if(k === 'startDesc') el.innerHTML = dict[k];
        else el.textContent = dict[k];
    });
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(x => x.classList.toggle('active', x === b));
    applyLang();
}));
applyLang();
</script>
</body>
</html>
